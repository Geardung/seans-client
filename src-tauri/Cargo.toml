[package]
name = "seans"
version = "0.1.0"
description = "Seans Windows media client"
authors = ["tedeshi"]
edition = "2021"
rust-version = "1.77.2"
# Main binary name: seans.exe (set via [[bin]] below)

[lib]
name = "seans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seans"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
winresource = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
